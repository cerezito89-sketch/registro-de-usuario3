<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de alumnos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>REGISTRO DE ALUMNOS</h1>

    <div class="contenedor">

        <img src="https://tse3.mm.bing.net/th/id/OIP.Tmydj6gtiL2SqggfUVt1EwHaFc?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" id="imagen" alt="Registro de alumnos">

        <br><br>

        <label>Nombre completo:</label>
        <input type="text" id="nombre">

        <br><br>

        <label>Apellido paterno:</label>
        <input type="text" id="paterno">

        <br><br>

        <label>Apellido materno:</label>
        <input type="text" id="materno">

        <br><br>

        <label>Teléfono:</label>
        <input type="text" id="telefono">

        <br><br>

        <label>Dirección:</label>
        <input type="text" id="direccion">

        <br><br>

        <label>Correo electrónico:</label>
        <input type="text" id="correo">

        <br><br>

        <button onclick="registrar()">Enviar</button>

        <h2 id="resultado"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
